name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'driver/redis', 'driver/postgres', 'tests/contracts', 'examples/postgres']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...
        working-directory: ${{ matrix.module }}
