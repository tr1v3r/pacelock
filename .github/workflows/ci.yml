name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', 'stable']
        redis: ['7.0-alpine', '7-alpine', '8-alpine']
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: test -z "$(gofmt -l .)"
      - name: All modules and shared Redis/PostgreSQL contracts
        run: sh scripts/check.sh -coverprofile=coverage.out
        env:
          PACELOCK_REDIS_ADDR: localhost:6379
          PACELOCK_REQUIRED_REDIS_BACKENDS: standalone
          PACELOCK_REQUIRED_DRIVER_BACKENDS: redis
      - name: Repeat contention tests with randomized order
        working-directory: driver/redis
        run: go test -race -shuffle=on -count=3 -timeout=5m -run '^TestRedisConcurrency$' .
        env:
          PACELOCK_REDIS_ADDR: localhost:6379
          PACELOCK_REQUIRED_REDIS_BACKENDS: standalone
          PACELOCK_REQUIRED_DRIVER_BACKENDS: redis
      - run: go test -run '^$' -bench BenchmarkValidate -benchtime=100ms -benchmem .
        working-directory: driver/redis
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-go-${{ matrix.go }}-redis-${{ matrix.redis }}
          path: "**/coverage.out"
          retention-days: 14
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: docker compose up -d --wait
      - name: Full suite including standalone and Cluster contention
        run: sh scripts/check.sh
        env:
          PACELOCK_REDIS_ADDR: localhost:16379
          PACELOCK_REDIS_CLUSTER_ADDRS: localhost:17000,localhost:17001,localhost:17002
          PACELOCK_REQUIRED_REDIS_BACKENDS: standalone,cluster
          PACELOCK_POSTGRES_DSN: postgres://pacelock:pacelock-test-only@localhost:15439/pacelock?sslmode=disable
          PACELOCK_REQUIRED_DRIVER_BACKENDS: redis,postgres
      - name: Repeat contention tests with randomized order
        working-directory: driver/redis
        run: go test -race -shuffle=on -count=3 -timeout=5m -run '^TestRedisConcurrency$' .
        env:
          PACELOCK_REDIS_ADDR: localhost:16379
          PACELOCK_REDIS_CLUSTER_ADDRS: localhost:17000,localhost:17001,localhost:17002
          PACELOCK_REQUIRED_REDIS_BACKENDS: standalone,cluster
          PACELOCK_POSTGRES_DSN: postgres://pacelock:pacelock-test-only@localhost:15439/pacelock?sslmode=disable
          PACELOCK_REQUIRED_DRIVER_BACKENDS: redis,postgres
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go test -run '^$' -fuzz FuzzInterval -fuzztime 20s .
        working-directory: driver/redis
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {go: '1.26.x', postgres: '16-alpine'}
          - {go: 'stable', postgres: '17-alpine'}
          - {go: 'stable', postgres: '18-alpine'}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: pacelock
          POSTGRES_PASSWORD: pacelock-test-only
          POSTGRES_DB: pacelock
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pacelock -d pacelock" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: sh scripts/check.sh
        env:
          PACELOCK_POSTGRES_DSN: postgres://pacelock:pacelock-test-only@localhost:5432/pacelock?sslmode=disable
          PACELOCK_REQUIRED_DRIVER_BACKENDS: postgres
